# ============================================================================
# Experiment Configuration — Airborne Hyperspectral Forest Classification
# ============================================================================
# Edit paths below to point to your local data directory.
# All other parameters have sensible defaults for the Hyytiälä site.

# --- Paths ---
data:
  # Root directory containing downloaded Etsin data
  root_dir: "C:/Users/aggarwm1/Videos/multi-disciplinary_Hyperspectral/model/data"

  # Path to the metadata CSV/Excel linking stand IDs to labels
  metadata_file: "stand_metadata.csv"

  # Directory containing analysis-ready 100m x 100m CASI plot tiles
  casi_tile_dir: "Hyperspectral/Airborne_data/Airborne_hyperspectral/Airborne_data/Airborne_hyperspectral/Analysis_ready_subsets/CASI"

  # Directory containing analysis-ready 100m x 100m SASI plot tiles
  sasi_tile_dir: "Hyperspectral/Airborne_data/Airborne_hyperspectral/Airborne_data/Airborne_hyperspectral/Analysis_ready_subsets/CS"

  # Directory containing ALS-derived 1m DEMs
  als_dem_dir: "Hyperspectral/Airborne_data/Airborne_hyperspectral/Airborne_data/Airborne_hyperspectral/Analysis_ready_subsets/ALS"

  # How tile filenames map to stand IDs in metadata
  # The loader strips this suffix from filenames to get stand IDs
  tile_filename_pattern: "*_CASI.tif"  # CASI tiles follow pattern STANDID_CASI.tif
  tile_id_from_filename: "stem"   # use filename stem as stand ID

# --- Metadata column names ---
# Adjust these to match the actual column headers in your metadata file
metadata:
  stand_id_col: "stand_id"
  site_col: "site"
  forest_type_col: "forest_type"          # coniferous / broadleaved / mixed
  dominant_species_col: "dominant_species"  # e.g., "Norway spruce"
  latitude_col: "latitude"
  longitude_col: "longitude"

# --- Spectral preprocessing ---
preprocessing:
  # Sensor to use: "casi", "sasi", or "merged"
  sensor: "casi"

  # Normalization method: "standard", "snv", "minmax", or "none"
  normalization: "standard"

  # Bands to exclude (water vapor absorption, interpolated by ATCOR-4)
  # These wavelength ranges (nm) were interpolated, not measured
  exclude_wavelength_ranges_nm:
    - [895, 1003]
    - [1092, 1168]
    - [1302, 1528]
    - [1737, 2038]

  # Nodata value in the raster tiles (pixels to mask)
  nodata_value: 10000  # GeoTIFF tiles use 10000 as nodata (reflectance scale factor)
  reflectance_scale_factor: 10000  # divide raw int values by this to get [0,1] reflectance

  # Known CASI-1500 center wavelengths (nm) for 48-band sensor (from ENVI headers)
  casi_wavelengths_nm: [381.97, 396.21, 410.45, 424.70, 438.94, 453.19, 467.43, 481.68,
    495.92, 510.17, 524.42, 538.66, 552.91, 567.16, 581.41, 595.66, 609.91, 624.17,
    638.42, 652.67, 666.93, 681.18, 695.44, 709.69, 723.95, 738.21, 752.47, 766.73,
    780.99, 795.25, 809.51, 823.78, 838.04, 852.31, 866.58, 880.85, 895.12, 909.39,
    923.65, 937.93, 952.20, 966.48, 980.75, 995.03, 1009.31, 1023.59, 1037.87, 1052.15]

  # Minimum fraction of valid pixels required per stand tile
  min_valid_pixel_fraction: 0.5

# --- Feature extraction ---
features:
  # Level of feature extraction: "stand", "pixel", or "patch"
  level: "stand"

  # For stand-level: summary statistic over all valid pixels
  stand_summary: "mean"   # "mean", "median", or "both"

  # For patch-level: patch size in pixels
  patch_size: 15
  patch_stride: 15  # non-overlapping by default

  # Optional PCA reduction (0 = no reduction)
  pca_components: 10

  # Whether to include spectral indices as additional features
  include_indices: false  # NDVI, red-edge index, etc.

# --- Models ---
models:
  # List of models to run in the baseline sweep
  classifiers:
    - name: "LogisticRegression"
      params:
        C: 1.0
        solver: "lbfgs"
        class_weight: "balanced"
        max_iter: 1000

    - name: "RandomForest"
      params:
        n_estimators: 500
        class_weight: "balanced"
        max_depth: null
        min_samples_leaf: 2
        n_jobs: -1

    - name: "SVM"
      params:
        kernel: "rbf"
        C: 10.0
        gamma: "scale"
        class_weight: "balanced"

    - name: "GradientBoosting"
      params:
        n_estimators: 200
        learning_rate: 0.1
        max_depth: 5
        subsample: 0.8

    - name: "PLSDA"
      params:
        n_components: 10
        max_iter: 500

# --- Validation ---
validation:
  # Primary CV strategy: "loso_site" (leave-one-site-out) for multi-site
  primary_cv: "loso_site"

  # Number of folds for stratified K-fold (used when only 1 site)
  n_folds: 4

  # Grouping variable for GroupKFold
  group_col: "site"  # for multi-site leave-one-site-out

# --- Evaluation ---
evaluation:
  metrics:
    - "overall_accuracy"
    - "balanced_accuracy"
    - "macro_f1"
    - "cohens_kappa"
    - "per_class_precision"
    - "per_class_recall"
    - "confusion_matrix"

  # Save predictions for later analysis
  save_predictions: true

  # Generate figures
  save_figures: true

# --- Output ---
output:
  dir: "outputs"
  experiment_name: "pca10_multisite_casi_loso"

# --- Reproducibility ---
random_state: 42
